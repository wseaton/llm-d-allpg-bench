## router-holdback-0.8 for the Qwen3-32B pool (vllm/vllm.yaml). maxConcurrency 22: the live-only
## sweep (program-vllm-cal.sh) crosses the 500 ms TTFT p99 SLO at ~18 running requests per engine,
## and 18 / 0.8 puts the batch holdback ceiling there.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  epp:
    flags:
      v: 2
      allow-experimental-plugins: true
    pluginsConfigFile: "slo-plugins.yaml"
    pluginsCustomConfig:
      slo-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: global-strict-fairness-policy
        - type: fcfs-ordering-policy
        - type: priority-holdback-policy
          name: holdback
          parameters:
            domain: rank
            minCeiling: 0.8
            maxCeiling: 1.0
        - type: concurrency-detector
          parameters:
            maxConcurrency: 22
            concurrencyMode: requests
            headroom: 0.0
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
        flowControl:
          maxBytes: "10Gi"
          maxRequests: "20k"
          defaultRequestTTL: "60s"
          saturationDetector:
            pluginRef: concurrency-detector
          usageLimitPolicyPluginRef: holdback
          priorityBands:
          - priority: 100
            maxRequests: "2k"
            fairnessPolicyRef: global-strict-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: 0
            maxRequests: "2k"
            fairnessPolicyRef: global-strict-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: -10
            maxRequests: "10k"
            fairnessPolicyRef: global-strict-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
  modelServers:
    matchLabels:
      app: vllm-slo
  monitoring:
    prometheus:
      enabled: false
      auth:
        enabled: false
