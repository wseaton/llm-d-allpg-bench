# Redis for the redis-sortedset transport runs, on the Postgres node with the same 8 cores.
# appendonly=no pairs with Postgres synchronous_commit=off. io-threads uses the cores for
# socket I/O and parsing; command execution stays single-threaded.
apiVersion: v1
kind: Pod
metadata:
  name: bench-redis
  labels: {app: bench-redis}
spec:
  nodeSelector: {kubernetes.io/hostname: g12e022}
  containers:
    - name: redis
      image: redis:7
      args: ["--appendonly", "no", "--io-threads", "8", "--io-threads-do-reads", "yes"]
      ports:
        - containerPort: 6379
      resources:
        requests: {cpu: "8", memory: 4Gi}
        limits: {cpu: "8", memory: 32Gi}
      readinessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bench-redis
spec:
  selector: {app: bench-redis}
  ports:
    - port: 6379
