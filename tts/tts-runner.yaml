# In-cluster load generator pod for tts-load.py (kubectl cp the script in and exec it).
apiVersion: v1
kind: Pod
metadata:
  name: tts-runner
  labels: {app: tts-runner}
spec:
  containers:
    - name: runner
      image: python:3.12-slim
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: "4", memory: 4Gi}
